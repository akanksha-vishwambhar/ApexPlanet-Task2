<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 2 | ApexPlanet Internship</title>
  <link rel="stylesheet" href="Task2.css" />
</head>
<body>
  <header>
    <h2>ApexPlanet Internship  - Task 2</h2>
    <nav>
      <a href="#contact" class="active">Contact Form</a>
      <a href="#todo">To-Do List</a>
    </nav>
  </header>

  <main>
    <!-- Contact Form Card -->
    <section id="contact" class="card">
      <h3>Contact Form</h3>
      <form id="contactForm">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name" />

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" />

        <label for="message">Message</label>
        <textarea id="message" rows="4" placeholder="Write your message"></textarea>

        <button type="submit">Submit</button>
        <p id="error"></p>
      </form>
    </section>

    <!-- To-Do List Card -->
    <section id="todo" class="card">
      <h3>To-Do List</h3>
      <div class="todo-input">
        <input type="text" id="taskInput" placeholder="Add a new task..." />
        <button id="addTask">Add</button>
      </div>
      <ul id="taskList"></ul>
    </section>
  </main>

  <footer>
    <p>© 2025 ApexPlanet Internship Project | HTML • CSS • JavaScript</p>
  </footer>

  <script src="script2.js"></script>
</body>
</html>
